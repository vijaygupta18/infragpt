# ExternalSecret stubs — STUBS, not finished manifests.
#
# Adjust `secretStoreRef` to whatever ClusterSecretStore this cluster already
# uses, and adjust `remoteRef.key` to the real secret paths, BEFORE applying.
# Applying these as-is will produce ExternalSecrets stuck in SecretSyncedError,
# which is loud and harmless — but still a wasted round trip.
#
# No secret VALUE appears in this repository, and none ever should. Everything
# here is a reference to a secret that lives in the secret manager.
#
# ROTATION: any credential that has ever appeared in a chat transcript
# MUST be rotated before launch. Treat any credential that has been in a chat
# transcript, a terminal history or a ticket as compromised.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: infragpt-app
  namespace: apps
  labels:
    app.kubernetes.io/name: infragpt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store # TODO: replace with this cluster's store
    kind: ClusterSecretStore
  target:
    name: infragpt-app
    creationPolicy: Owner
  data:
    # Juspay Grid gateway key (LLM selection + synthesis).
    - secretKey: GRID_API_KEY
      remoteRef:
        key: infragpt-grid-api-key # TODO: real secret name

    # Postgres password for the infragpt_ro role.
    #
    # This role must be created with READ-ONLY privileges on the AlloyDB
    # readers and nothing else. That grant is what actually makes the DB
    # surface read-only; the registry only decides which reads are offered.
    #   CREATE ROLE infragpt_ro LOGIN PASSWORD '...';
    #   GRANT pg_monitor TO infragpt_ro;   -- pg_stat_* visibility
    #   GRANT CONNECT ON DATABASE <DRIVER_DB>_v1 TO infragpt_ro;
    # Creating that role is a PRODUCTION WRITE and needs its own approval.
    - secretKey: INFRAGPT_PG_PASSWORD
      remoteRef:
        key: infragpt-pg-password # TODO: real secret name

    # Redis auth, if the instances require it. Omit both if they do not.
    - secretKey: GCP_REDIS_PASSWORD
      remoteRef:
        key: infragpt-gcp-redis-password # TODO
    - secretKey: AWS_REDIS_PASSWORD
      remoteRef:
        key: infragpt-aws-redis-password # TODO
---
# Kubeconfig for BOTH clusters, mounted read-only at /kubeconfig.
#
# RISK, from the plan: a single deployment reaching both clouds means a pod
# compromise exposes read access to GKE prod AND EKS prod. That is bounded by
# these credentials being strictly read-only — which is enforced by the RBAC in
# 01-serviceaccount-rbac.yaml on the GKE side, and must be enforced by the
# equivalent EKS RBAC/IAM binding on the AWS side. Confirm the EKS side is
# read-only before applying; nothing in this repo can enforce it for you.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: infragpt-kubeconfig
  namespace: apps
  labels:
    app.kubernetes.io/name: infragpt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store # TODO
    kind: ClusterSecretStore
  target:
    name: infragpt-kubeconfig
    creationPolicy: Owner
  data:
    - secretKey: config
      remoteRef:
        key: infragpt-kubeconfig # TODO: merged read-only kubeconfig, both contexts
---
# NOTE: the backup ExternalSecret that lived here was removed on 2026-08-19,
# together with the backup CronJob it fed. It had never resolved — its TODO
# placeholders were never filled — which is why the CronJob hung on every run.
