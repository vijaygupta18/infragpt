# ServiceAccount and RBAC for infragpt.
#
# THIS FILE IS THE REAL READ-ONLY ENFORCEMENT for the k8s surface.
#
# The registry restricts which kubectl verbs can be expressed, and the executor
# re-checks that allowlist in code — but both of those are our own software
# checking itself. RBAC is the layer that holds when our software is wrong: a
# `delete` that somehow got past every guard above is refused by the API server,
# because this ServiceAccount has never been granted it.
#
# Verbs are get/list/watch ONLY. Do not add create/update/patch/delete to any
# rule here, and do not add `pods/exec` or `pods/portforward` — exec is a shell
# into a production pod and would hand the assistant a mutation path that the
# rest of the design spends its whole effort removing.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infragpt
  namespace: apps
  labels:
    app.kubernetes.io/name: infragpt
  annotations:
    # These two ARE the read-only guarantee for the cloud surfaces, and they must
    # live in this file. Applying a ServiceAccount without them silently strips
    # both bindings, and the failure is quiet: the pod keeps running and every
    # cloud call fails with a credentials error that looks like an outage.
    #
    # GCP: Workload Identity. Five *.viewer roles, no key file anywhere.
    iam.gke.io/gcp-service-account: infragpt@<GCP_PROJECT>.iam.gserviceaccount.com
    # AWS: IRSA. CloudWatch + ElastiCache read only; trust pins this exact
    # namespace/serviceaccount pair, not just the OIDC provider.
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/infragpt-irsa-role
---
# Namespaced reads, scoped to `apps` — the only namespace the registry offers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infragpt-read
  namespace: apps
  labels:
    app.kubernetes.io/name: infragpt
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
    verbs: ["get", "list", "watch"]
  # configmaps are DELIBERATELY ABSENT. Restricting the verb does not help:
  # `list` returns whole ConfigMap objects including `data`, and configmap values
  # may carry credentials, connection strings and tokens. Since the
  # read-only ServiceAccount is the backstop that makes everything else safe,
  # anything that can leak a credential through a *read* has to be excluded at
  # this layer — a guardrail one level up cannot recover it.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infragpt-read
  namespace: apps
  labels:
    app.kubernetes.io/name: infragpt
subjects:
  - kind: ServiceAccount
    name: infragpt
    namespace: apps
roleRef:
  kind: Role
  name: infragpt-read
  apiGroup: rbac.authorization.k8s.io
---
# `node_top` reads nodes, which are cluster-scoped and cannot be granted by a
# namespaced Role. This ClusterRole is deliberately the narrowest thing that
# makes `kubectl top nodes` work: nodes and node metrics, read verbs only.
# No secrets, no namespaces, no RBAC objects, no CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infragpt-node-read
  labels:
    app.kubernetes.io/name: infragpt
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infragpt-node-read
  labels:
    app.kubernetes.io/name: infragpt
subjects:
  - kind: ServiceAccount
    name: infragpt
    namespace: apps
roleRef:
  kind: ClusterRole
  name: infragpt-node-read
  apiGroup: rbac.authorization.k8s.io
