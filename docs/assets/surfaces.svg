<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Seven read-only surfaces: metrics, logs, database, kubernetes, cache, cloud, analytics, and the shell guard. Each card lights up in turn.">
  <title>infragpt — what it can reach, all of it read-only</title>
  <defs>
    <style>
      :root{--ink:#1b1a17;--ink-2:#565049;--muted:#8a837a;--line:#d9d3ca;--card:#ffffff;--ok:#1f7a4d;--acc:#1a6ad4}
      @media (prefers-color-scheme:dark){:root{--ink:#ece7df;--ink-2:#b6ada1;--muted:#857c70;--line:#322e29;--card:#17150f;--ok:#46c88a;--acc:#6aa6f5}}
      .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .ink{fill:var(--ink)}.in2{fill:var(--ink-2)}.mut{fill:var(--muted)}
      .card{fill:var(--card);stroke:var(--line);stroke-width:1}
      /* Cards fade in on a stagger, then the status dot breathes forever. */
      .c{animation:in .8s ease-out both}
      .c:nth-of-type(1){animation-delay:.05s}.c:nth-of-type(2){animation-delay:.2s}.c:nth-of-type(3){animation-delay:.35s}.c:nth-of-type(4){animation-delay:.5s}
      .c:nth-of-type(5){animation-delay:.65s}.c:nth-of-type(6){animation-delay:.8s}.c:nth-of-type(7){animation-delay:.95s}.c:nth-of-type(8){animation-delay:1.1s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      /* A sweep highlights one card at a time, in the order a triage runs. */
      .card{animation:sweep 9.6s ease-in-out infinite}
      .c:nth-of-type(1) .card{animation-delay:0s}.c:nth-of-type(2) .card{animation-delay:1.2s}.c:nth-of-type(3) .card{animation-delay:2.4s}.c:nth-of-type(4) .card{animation-delay:3.6s}
      .c:nth-of-type(5) .card{animation-delay:4.8s}.c:nth-of-type(6) .card{animation-delay:6s}.c:nth-of-type(7) .card{animation-delay:7.2s}.c:nth-of-type(8) .card{animation-delay:8.4s}
      @keyframes sweep{0%,4%{stroke:var(--line);stroke-width:1}7%,11%{stroke:var(--acc);stroke-width:2}15%,100%{stroke:var(--line);stroke-width:1}}
      .dot{animation:breathe 2.4s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.c{animation:none}.card{animation:none}.dot{animation:none;opacity:1}}
    </style>
  </defs>

  <text x="0" y="20" class="s ink" font-size="15" font-weight="600">Seven surfaces, one contract</text>
  <text x="0" y="40" class="s mut" font-size="12">Every card is a set of registry entries. Each entry names its executor, its typed parameters, and the read-only kind that lets it load at all.</text>

  <g transform="translate(0,62)">
    <g class="c"><rect class="card" x="0" y="0" width="210" height="76" rx="10"/><circle class="dot" cx="16" cy="18" r="4" fill="var(--ok)"/><text x="28" y="22" class="s ink" font-size="12.5" font-weight="600">Metrics</text><text x="16" y="42" class="s in2" font-size="10.5">error rates, p99, saturation,</text><text x="16" y="56" class="s in2" font-size="10.5">alert rules, metric discovery</text><text x="194" y="66" class="t mut" font-size="9" text-anchor="end">promql · cloudwatch</text></g>
    <g class="c" transform="translate(223,0)"><rect class="card" x="0" y="0" width="210" height="76" rx="10"/><circle class="dot" cx="16" cy="18" r="4" fill="var(--ok)"/><text x="28" y="22" class="s ink" font-size="12.5" font-weight="600">Logs</text><text x="16" y="42" class="s in2" font-size="10.5">app and mesh logs, request ids,</text><text x="16" y="56" class="s in2" font-size="10.5">one request across every service</text><text x="194" y="66" class="t mut" font-size="9" text-anchor="end">opensearch via mcp</text></g>
    <g class="c" transform="translate(446,0)"><rect class="card" x="0" y="0" width="210" height="76" rx="10"/><circle class="dot" cx="16" cy="18" r="4" fill="var(--ok)"/><text x="28" y="22" class="s ink" font-size="12.5" font-weight="600">Database</text><text x="16" y="42" class="s in2" font-size="10.5">schema, indexes, bloat, locks,</text><text x="16" y="56" class="s in2" font-size="10.5">replication lag, live queries</text><text x="194" y="66" class="t mut" font-size="9" text-anchor="end">SELECT-only · replica</text></g>
    <g class="c" transform="translate(669,0)"><rect class="card" x="0" y="0" width="210" height="76" rx="10"/><circle class="dot" cx="16" cy="18" r="4" fill="var(--ok)"/><text x="28" y="22" class="s ink" font-size="12.5" font-weight="600">Kubernetes</text><text x="16" y="42" class="s in2" font-size="10.5">pods, events, nodes, HPAs, PDBs,</text><text x="16" y="56" class="s in2" font-size="10.5">Istio objects, cluster-wide</text><text x="194" y="66" class="t mut" font-size="9" text-anchor="end">get · list · watch</text></g>
    <g class="c" transform="translate(0,92)"><rect class="card" x="0" y="0" width="210" height="76" rx="10"/><circle class="dot" cx="16" cy="18" r="4" fill="var(--ok)"/><text x="28" y="22" class="s ink" font-size="12.5" font-weight="600">Cache</text><text x="16" y="42" class="s in2" font-size="10.5">key existence, TTL, type, members,</text><text x="16" y="56" class="s in2" font-size="10.5">compared across clouds</text><text x="194" y="66" class="t mut" font-size="9" text-anchor="end">redis · read verbs</text></g>
    <g class="c" transform="translate(223,92)"><rect class="card" x="0" y="0" width="210" height="76" rx="10"/><circle class="dot" cx="16" cy="18" r="4" fill="var(--ok)"/><text x="28" y="22" class="s ink" font-size="12.5" font-weight="600">Cloud</text><text x="16" y="42" class="s in2" font-size="10.5">instances, capacity, node pools,</text><text x="16" y="56" class="s in2" font-size="10.5">per-query time attribution</text><text x="194" y="66" class="t mut" font-size="9" text-anchor="end">viewer IAM only</text></g>
    <g class="c" transform="translate(446,92)"><rect class="card" x="0" y="0" width="210" height="76" rx="10"/><circle class="dot" cx="16" cy="18" r="4" fill="var(--ok)"/><text x="28" y="22" class="s ink" font-size="12.5" font-weight="600">Analytics</text><text x="16" y="42" class="s in2" font-size="10.5">business data in ClickHouse,</text><text x="16" y="56" class="s in2" font-size="10.5">separate from infra metadata</text><text x="194" y="66" class="t mut" font-size="9" text-anchor="end">readonly=1</text></g>
    <g class="c" transform="translate(669,92)"><rect class="card" x="0" y="0" width="210" height="76" rx="10"/><circle class="dot" cx="16" cy="18" r="4" fill="var(--acc)"/><text x="28" y="22" class="s ink" font-size="12.5" font-weight="600">Shell guard</text><text x="16" y="42" class="s in2" font-size="10.5">the one surface that composes</text><text x="16" y="56" class="s in2" font-size="10.5">commands: allowlisted, no shell</text><text x="194" y="66" class="t mut" font-size="9" text-anchor="end">shlex · execve</text></g>
  </g>
</svg>
