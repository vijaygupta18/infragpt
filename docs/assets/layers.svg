<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Four independent layers must all fail before a write is possible: registry, parameter validation, executor allowlists, and credentials.">
  <title>Four layers, and only the innermost is not our own code</title>

  <defs>
    <style>
      :root {
        --ink:#1b1a17; --ink-2:#565049; --muted:#8a837a; --line:#d9d3ca;
        --card:#ffffff; --ok:#1f7a4d; --warn:#b7791f; --fail:#c0392b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink:#ece7df; --ink-2:#b6ada1; --muted:#857c70; --line:#322e29;
          --card:#17150f; --ok:#46c88a; --warn:#e0b155; --fail:#e8705f;
        }
      }
      .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .ink{fill:var(--ink)} .in2{fill:var(--ink-2)} .mut{fill:var(--muted)}
      .ring{fill:none;stroke:var(--line);stroke-width:1.5}

      /* A write attempt tries each ring and is stopped. It never reaches the
         centre — which is the whole claim the diagram is making. */
      .attempt{animation:probe 8s ease-in-out infinite}
      @keyframes probe{
        0%,6%   {transform:translateX(0);opacity:0}
        10%     {opacity:1}
        20%     {transform:translateX(96px)}
        30%     {transform:translateX(96px)}
        45%     {transform:translateX(192px)}
        55%     {transform:translateX(192px)}
        70%     {transform:translateX(288px)}
        80%     {transform:translateX(288px)}
        90%,100%{transform:translateX(288px);opacity:0}
      }
      .stop{opacity:0;animation:blink 8s ease-in-out infinite}
      @keyframes blink{0%,18%{opacity:0}22%,26%{opacity:1}30%,100%{opacity:0}}
      .s2{animation-delay:1.9s}.s3{animation-delay:3.8s}.s4{animation-delay:5.6s}
      @media (prefers-reduced-motion: reduce){
        .attempt{animation:none;transform:translateX(288px);opacity:1}
        .stop{animation:none;opacity:.85}
      }
    </style>
  </defs>

  <text x="0" y="20" class="s ink" font-size="15" font-weight="600">Four layers must all fail before a write is possible</text>
  <text x="0" y="40" class="s mut" font-size="12">Three of them are our own code. The fourth is not, which is why it is the one that counts.</text>

  <g transform="translate(30,74)">
    <g>
      <rect x="0" y="0" width="150" height="96" rx="10" class="ring" fill="var(--card)"/>
      <text x="75" y="26" class="s ink" font-size="12.5" text-anchor="middle" font-weight="600">Registry</text>
      <text x="75" y="46" class="s in2" font-size="10.5" text-anchor="middle">only declared</text>
      <text x="75" y="60" class="s in2" font-size="10.5" text-anchor="middle">capabilities exist</text>
      <text x="75" y="82" class="t mut" font-size="9" text-anchor="middle">reviewed in git</text>
      <g class="stop"><text x="75" y="-8" class="t" font-size="10" text-anchor="middle" fill="var(--fail)">refused</text></g>
    </g>
    <g transform="translate(192,0)">
      <rect x="0" y="0" width="150" height="96" rx="10" class="ring" fill="var(--card)"/>
      <text x="75" y="26" class="s ink" font-size="12.5" text-anchor="middle" font-weight="600">Validation</text>
      <text x="75" y="46" class="s in2" font-size="10.5" text-anchor="middle">rejects, never</text>
      <text x="75" y="60" class="s in2" font-size="10.5" text-anchor="middle">repairs a param</text>
      <text x="75" y="82" class="t mut" font-size="9" text-anchor="middle">typed slots</text>
      <g class="stop s2"><text x="75" y="-8" class="t" font-size="10" text-anchor="middle" fill="var(--fail)">refused</text></g>
    </g>
    <g transform="translate(384,0)">
      <rect x="0" y="0" width="150" height="96" rx="10" class="ring" fill="var(--card)"/>
      <text x="75" y="26" class="s ink" font-size="12.5" text-anchor="middle" font-weight="600">Executors</text>
      <text x="75" y="46" class="s in2" font-size="10.5" text-anchor="middle">read verbs only,</text>
      <text x="75" y="60" class="s in2" font-size="10.5" text-anchor="middle">no shell at all</text>
      <text x="75" y="82" class="t mut" font-size="9" text-anchor="middle">shlex + execve</text>
      <g class="stop s3"><text x="75" y="-8" class="t" font-size="10" text-anchor="middle" fill="var(--fail)">refused</text></g>
    </g>
    <g transform="translate(576,0)">
      <rect x="0" y="0" width="174" height="96" rx="10" fill="var(--card)" stroke="var(--ok)" stroke-width="2"/>
      <text x="87" y="26" class="s ink" font-size="12.5" text-anchor="middle" font-weight="600">Credentials</text>
      <text x="87" y="46" class="s in2" font-size="10.5" text-anchor="middle">SELECT-only role on a</text>
      <text x="87" y="60" class="s in2" font-size="10.5" text-anchor="middle">physical replica</text>
      <text x="87" y="82" class="t" font-size="9" text-anchor="middle" fill="var(--ok)">not our code — physics</text>
      <g class="stop s4"><text x="87" y="-8" class="t" font-size="10" text-anchor="middle" fill="var(--ok)">impossible</text></g>
    </g>

    <g class="attempt" transform="translate(-22,48)">
      <circle cx="0" cy="0" r="6" fill="var(--fail)"/>
      <text x="0" y="-14" class="t" font-size="9" text-anchor="middle" fill="var(--fail)">write</text>
    </g>
  </g>

  <text x="30" y="228" class="s mut" font-size="11">A driver on a read replica cannot write even if every line of this repository were wrong.</text>
</svg>
