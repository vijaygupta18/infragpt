# infragpt registry — Kubernetes surface (READ-ONLY)
#
# Every entry is an ARGV ARRAY. There is no shell anywhere in the k8s path:
# the executor calls asyncio.create_subprocess_exec with a list, never
# shell=True and never a joined command string. That is why a shell metachar in
# a parameter cannot become a command — there is no shell to interpret it.
#
# `kubectl` and `--context <resolved>` are prepended by the executor. The LLM
# never supplies a context, a kubeconfig, or a server URL.
#
# The verb (argv[0]) is checked against an allowlist IN CODE as well as here:
# get, list, describe, logs, top, events, version. Anything else is refused even
# if it appears in this file.
#
# The real enforcement is RBAC: the ServiceAccount this process runs as holds
# get/list/watch only, so a mutating verb would be denied by the API server even
# if every layer above failed.
#
# `cloud` selects the context: gcp -> GKE prod, aws -> EKS prod. Drivers poll
# the cloud they registered in, so the cloud must be established from the
# question, never assumed.

entries:
  - name: pod_logs
    surface: k8s:gcp
    kind: kubectl
    description: >-
      Recent log lines from a pod, newest window only. Both the line count and
      the lookback window are capped — this cannot stream or dump a full log.
      Log content is PII-redacted before it is returned.
    target: k8s_$cloud
    tags: [pii]
    argv:
      - logs
      - $pod
      - -n
      - $namespace
      - -c
      - $container
      - --tail=$tail
      - --since=$since
      - --timestamps=true
    params:
      pod:
        type: string
        required: true
        max_length: 253
        description: Exact pod name, e.g. driver-offer-bpp-7d9c5f8b6d-abcde.
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      namespace:
        type: enum
        required: false
        default: $NAMESPACE_DEFAULT
        values: $NAMESPACES
        description: Kubernetes namespace. Defaults to apps.
      container:
        type: string
        required: false
        max_length: 253
        description: >-
          Container name within the pod. Omit for single-container pods.
      tail:
        type: int
        required: false
        default: 200
        min: 1
        max: 1000
        description: Number of trailing log lines. Hard-capped at 1000.
      since:
        type: enum
        required: false
        default: 15m
        values: [5m, 15m, 30m, 1h, 3h, 6h]
        description: >-
          Lookback window. Enumerated rather than free-form so no caller can
          request an unbounded history.
      grep:
        type: string
        required: false
        max_length: 200
        description: >-
          Keep only output lines containing this exact text. Use it whenever the
          question is about something specific (an error string, a pod name, a
          status like CrashLoopBackOff) rather than reading everything. It is a
          literal substring match, not a regex or a glob. Filtering here is far
          cheaper than returning a whole namespace and reasoning over it.
      grep_context:
        type: int
        required: false
        default: 0
        min: 0
        max: 20
        description: Lines of surrounding context to keep around each match.
    timeout_s: 30

