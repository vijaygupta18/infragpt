  - name: count_pods
    surface: k8s:gcp
    kind: kubectl
    description: >-
      Pod NAMES only, one per line — use this for "how many pods", "which pods
      exist", or any question where the answer is a count or a list of names.
      Prefer it strongly over list_pods for counting: list_pods returns a wide
      table whose output for a busy namespace runs to tens of thousands of
      tokens, gets truncated, and then the count cannot be stated exactly. This
      returns one short line per pod, so the total is exact.
      It carries NO status, node or restart information. If the question is
      about health rather than quantity, use list_pods or pod_status instead.
      The result is already scoped to the requested namespace; the absence of a
      NAMESPACE column is expected, not a limitation.
    target: k8s_$cloud
    argv:
      - get
      - pods
      - -n
      - $namespace
      - -o
      - name
    params:
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      namespace:
        type: enum
        required: false
        default: $NAMESPACE_DEFAULT
        values: $NAMESPACES
        description: Namespace to count in. Defaults to apps.
      grep:
        type: string
        required: false
        max_length: 200
        description: >-
          Keep only names containing this exact text, e.g. "rider-app" to count
          one service's pods. Literal substring, not a regex.
      grep_context:
        type: int
        required: false
        default: 0
        min: 0
        max: 20
        description: Unused for name lists; present for consistency.
    row_limit: 2000
    timeout_s: 20

