        values: $NAMESPACES
        description: Kubernetes namespace. Defaults to apps.
      grep:
        type: string
        required: false
        max_length: 200
        description: >-
          Keep only output lines containing this exact text. Use it whenever the
          question is about something specific (an error string, a pod name, a
          status like CrashLoopBackOff) rather than reading everything. It is a
          literal substring match, not a regex or a glob. Filtering here is far
          cheaper than returning a whole namespace and reasoning over it.
      grep_context:
        type: int
        required: false
        default: 0
        min: 0
        max: 20
        description: Lines of surrounding context to keep around each match.
    row_limit: 200
    timeout_s: 25

  - name: list_pdb
    surface: k8s:gcp
    kind: kubectl
    description: >-
      PodDisruptionBudgets in a namespace, with MIN AVAILABLE / MAX UNAVAILABLE
      and ALLOWED DISRUPTIONS. The first thing to check when a node drain,
      cluster upgrade or autoscaler scale-down is stuck — a past EKS upgrade was
      blocked by five PDBs and nothing else in the cluster looked wrong.
      INTERPRETATION TRAP: ALLOWED DISRUPTIONS = 0 means the PDB is currently
      BLOCKING all voluntary eviction of its pods; that is the stuck-drain
      signal, and it is not an error state, so nothing will report it as one. A
      PDB whose selector matches no pods, or whose minAvailable equals the
      replica count, blocks drains permanently rather than temporarily.
    target: k8s_$cloud
    argv: [get, poddisruptionbudgets, -n, $namespace]
    params:
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      namespace:
        type: enum
        required: false
        default: $NAMESPACE_DEFAULT
        values: $NAMESPACES
        description: Kubernetes namespace. Defaults to apps.
    row_limit: 100
    timeout_s: 20

  - name: list_services
    surface: k8s:gcp
    kind: kubectl
    description: >-
      Services in a namespace with type, cluster IP, external IP, ports and
      selector. Use to confirm a service exists and which pods its selector is
      meant to reach.
      INTERPRETATION TRAP: a Service having a ClusterIP proves nothing about
      whether traffic works — a Service whose selector matches no Ready pod has
      zero endpoints and blackholes silently. The endpoint count is NOT shown
      here; cross-check with list_pods that pods matching the selector are Ready
      before concluding the service is healthy.
    target: k8s_$cloud
    argv: [get, services, -n, $namespace, -o, wide]
    params:
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      namespace:
        type: enum
        required: false
        default: $NAMESPACE_DEFAULT
        values: $NAMESPACES
        description: Kubernetes namespace. Defaults to apps.
      grep:
        type: string
        required: false
        max_length: 200
        description: >-
          Keep only output lines containing this exact text. Use it whenever the
          question is about something specific (an error string, a pod name, a
          status like CrashLoopBackOff) rather than reading everything. It is a
          literal substring match, not a regex or a glob. Filtering here is far
          cheaper than returning a whole namespace and reasoning over it.
      grep_context:
        type: int
        required: false
        default: 0
        min: 0
        max: 20
        description: Lines of surrounding context to keep around each match.
    row_limit: 200
    timeout_s: 20

  - name: list_statefulsets
    surface: k8s:gcp
    kind: kubectl
    description: >-
      StatefulSets in a namespace with ready/desired replicas and images.
      INTERPRETATION TRAP: StatefulSet rollouts are ORDERED and stop at the first
      pod that never becomes Ready, so a partially-updated StatefulSet is stuck,
      not slow — the remaining pods will never update on their own. Ready count
      below desired with no recent event usually means a PVC or a readiness probe,
      not scheduling.
    target: k8s_$cloud
    argv: [get, statefulsets, -n, $namespace, -o, wide]
    params:
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      namespace:
        type: enum
        required: false
        default: $NAMESPACE_DEFAULT
        values: $NAMESPACES
        description: Kubernetes namespace. Defaults to apps.
      grep:
        type: string
        required: false
        max_length: 200
        description: >-
          Keep only output lines containing this exact text. Use it whenever the
          question is about something specific (an error string, a pod name, a
          status like CrashLoopBackOff) rather than reading everything. It is a
          literal substring match, not a regex or a glob. Filtering here is far
          cheaper than returning a whole namespace and reasoning over it.
      grep_context:
        type: int
        required: false
        default: 0
        min: 0
        max: 20
        description: Lines of surrounding context to keep around each match.
    row_limit: 100
    timeout_s: 20

