  # NAMES ONLY (-o name), deliberately. ConfigMap VALUES here routinely
  # carry credentials, connection strings and API keys that were never meant to
  # be secrets but are — so dumping values would turn a read-only assistant into
  # a credential exfiltration path with an audit trail that says "get configmap".
  # Names answer the real question ("does this config object exist / what config
  # does this workload have") without ever emitting a value.
  #
  # There is deliberately NO Secret entry here, not even a names-only one, and
  # none must ever be added: listing Secret names leaks the shape of the
  # credential inventory, and `-o name` on Secrets is one flag away from `-o yaml`.

  # Names-only listings for the workload kinds. Added after a live question —
  # "which deployments have no PodDisruptionBudget" — where the model had to
  # list 707 deployments through a wide table, hit the output cap, and then
  # could not state a total. It tried `kubectl get deployments | wc -l`, which
  # is correctly refused (there is no shell), so the count stayed unanswerable.
  # A names-only listing is one short line per object and stays exact.
  - name: count_deployments
    surface: k8s:gcp
    kind: kubectl
    description: >-
      Deployment NAMES only, one per line — use for "how many deployments",
      "which deployments exist", or any question whose answer is a count or a
      list of names. Prefer it strongly over list_deployments for counting: the
      wide table for a busy namespace runs to tens of thousands of tokens, gets
      truncated, and then the total cannot be stated exactly.

      Carries no replica, image or status information. For health, use
      list_deployments instead.
    target: k8s_$cloud
    argv:
      - get
      - deployments
      - -n
      - $namespace
      - -o
      - name
    params:
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      namespace:
        type: enum
        required: false
        default: $NAMESPACE_DEFAULT
        values: $NAMESPACES
        description: Namespace to count in. Defaults to apps.
      grep:
        type: string
        required: false
        max_length: 200
        description: >-
          Keep only names containing this exact text. Literal substring, not a
          regex.
    row_limit: 2000
    timeout_s: 30

  - name: count_pdb
    surface: k8s:gcp
    kind: kubectl
    description: >-
      PodDisruptionBudget NAMES only, one per line. Pair with count_deployments
      to answer "which workloads have no PDB".

      READ AN EMPTY RESULT CAREFULLY: no PDBs in a namespace means NOTHING there
      is protected from eviction during a drain or upgrade — which is a finding
      worth stating plainly, not a blank answer. Verified in this environment on
      2026-08-19: the apps namespace had zero PDBs against 707 deployments.
    target: k8s_$cloud
    argv:
      - get
      - poddisruptionbudgets
      - -n
      - $namespace
      - -o
      - name
    params:
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      namespace:
        type: enum
        required: false
        default: $NAMESPACE_DEFAULT
        values: $NAMESPACES
        description: Namespace to look in. Defaults to apps.
    row_limit: 500
    timeout_s: 25
