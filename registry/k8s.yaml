  # ---------------------------------------------------------------------------
  # Istio service mesh (read-only CRD reads)
  #
  # Added after the gateway-VirtualService incident: a VirtualService route
  # pinned external traffic to a DestinationRule subset, and nobody could see it
  # from this tool. Pods were Running, Services had endpoints, and the mesh was
  # still blackholing requests.
  #
  # These two list entries are CLUSTER-WIDE (--all-namespaces) on purpose: the
  # gateway VirtualServices live outside `apps` (usually istio-system), so a
  # namespace-scoped list would miss exactly the objects that caused the outage.
  # ---------------------------------------------------------------------------

  - name: istio_virtualservices
    surface: k8s:gcp
    kind: kubectl
    description: >-
      All Istio VirtualServices in the cluster, across every namespace, with
      their gateways and hosts. Use when traffic reaches the mesh but not the
      workload — pods Running and Services populated, yet requests fail or land
      on the wrong version.
      INTERPRETATION TRAP: this listing shows gateways and hosts only, NOT the
      route rules. A VirtualService route can pin traffic to a DestinationRule
      `subset`, and if that subset's labels select no healthy pods the request
      blackholes with 503 even though every pod is Ready. To see the routes and
      subsets you must follow up with describe_virtualservice. Also note the
      NAMESPACE column: gateway VirtualServices normally live in istio-system,
      not apps, and a same-host VirtualService in another namespace can
      silently take precedence.
    target: k8s_$cloud
    argv: [get, virtualservices, --all-namespaces]
    params:
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      grep:
        type: string
        required: false
        max_length: 200
        description: >-
          Keep only output lines containing this exact text. Use it whenever the
          question is about something specific (an error string, a pod name, a
          status like CrashLoopBackOff) rather than reading everything. It is a
          literal substring match, not a regex or a glob. Filtering here is far
          cheaper than returning a whole namespace and reasoning over it.
      grep_context:
        type: int
        required: false
        default: 0
        min: 0
        max: 20
        description: Lines of surrounding context to keep around each match.
    row_limit: 200
    timeout_s: 20

  - name: istio_destinationrules
    surface: k8s:gcp
    kind: kubectl
    description: >-
      All Istio DestinationRules in the cluster, across every namespace, with
      their hosts. DestinationRules define the `subset` names that a
      VirtualService route is allowed to reference, plus TLS mode and outlier
      detection.
      INTERPRETATION TRAP: a VirtualService naming a subset that no
      DestinationRule defines produces "no healthy upstream" / 503 UH at the
      proxy with no Kubernetes event and no pod restart — the failure is invisible
      from pod-level checks. Pair this with istio_virtualservices whenever mesh
      routing is suspected, and compare the subset names in both directions.
      This listing does not show subset label selectors; use `describe` on the
      workload's pods to confirm the labels actually exist.
    target: k8s_$cloud
    argv: [get, destinationrules, --all-namespaces]
    params:
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      grep:
        type: string
        required: false
        max_length: 200
        description: >-
          Keep only output lines containing this exact text. Use it whenever the
          question is about something specific (an error string, a pod name, a
          status like CrashLoopBackOff) rather than reading everything. It is a
          literal substring match, not a regex or a glob. Filtering here is far
          cheaper than returning a whole namespace and reasoning over it.
      grep_context:
        type: int
        required: false
        default: 0
        min: 0
        max: 20
        description: Lines of surrounding context to keep around each match.
    row_limit: 200
    timeout_s: 20

  - name: describe_virtualservice
    surface: k8s:gcp
    kind: kubectl
    description: >-
      Full spec of one Istio VirtualService — hosts, gateways, HTTP/TLS/TCP
      route rules, match conditions, destination hosts, subsets and weights,
      retries and timeouts. This is the entry that actually shows subset pinning
      and traffic weights; istio_virtualservices only lists names.
      INTERPRETATION TRAP: a `subset` under route.destination is a reference into
      a DestinationRule, not a pod selector — confirm the subset exists with
      istio_destinationrules before concluding routing is correct. Route order
      matters: the FIRST matching http rule wins, so a broad early match can
      shadow every rule below it.
      LIMITATION: only the `apps` namespace is reachable from this tool, so a
      gateway VirtualService in istio-system can be LISTED by
      istio_virtualservices but cannot be described here. Say so rather than
      implying the object does not exist.
    target: k8s_$cloud
    argv: [describe, virtualservice, $virtualservice, -n, $namespace]
    params:
      virtualservice:
        type: string
        required: true
        max_length: 253
        description: Exact VirtualService name, from istio_virtualservices.
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
          that doubles the cost of every question and, for surfaces AWS cannot
          reach, produces a failure that reads like a fact about production.
      namespace:
        type: enum
        required: false
        default: $NAMESPACE_DEFAULT
        values: $NAMESPACES
        description: Kubernetes namespace. Only apps is reachable.
      grep:
        type: string
        required: false
        max_length: 200
        description: >-
          Keep only output lines containing this exact text. Use it whenever the
          question is about something specific (an error string, a pod name, a
          status like CrashLoopBackOff) rather than reading everything. It is a
          literal substring match, not a regex or a glob. Filtering here is far
          cheaper than returning a whole namespace and reasoning over it.
      grep_context:
        type: int
        required: false
        default: 0
        min: 0
        max: 20
        description: Lines of surrounding context to keep around each match.
    timeout_s: 25

  # ---------------------------------------------------------------------------
  # Workload and capacity inventory
  # ---------------------------------------------------------------------------

  - name: top_pods
    surface: k8s:gcp
    kind: kubectl
    description: >-
      Live CPU and memory usage per pod in a namespace, from metrics-server. Use
      to find which pod is consuming a saturated node, or to confirm a suspected
      memory leak before it OOMKills.
      INTERPRETATION TRAP: these are INSTANTANEOUS usage values, not requests or
      limits. A pod near its memory limit is invisible here unless you also read
      the limit from describe_pod — usage alone cannot tell you how close to
      OOMKill a pod is. If metrics-server is unavailable this returns an error,
      which is a metrics-server problem, not evidence the pods are idle.
    target: k8s_$cloud
    argv: [top, pods, -n, $namespace, --no-headers=false]
    params:
      cloud:
        type: enum
        required: false
        default: gcp
        values: [gcp, aws]
        description: >-
          Which cloud. DEFAULTS TO GCP and you should almost always leave it
          there: this platform is migrating to GCP, and AWS is only worth
          querying when the question NAMES it. Do not check both "to be safe" —
