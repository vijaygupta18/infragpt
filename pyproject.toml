[project]
name = "infragpt"
version = "0.1.0"
description = "Read-only AI infrastructure assistant (infractl CLI + web chat)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "python-jose[cryptography]>=3.3",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
infractl = "cli.main:app"

# Flat layout with two top-level packages: setuptools cannot auto-discover them,
# and without this the declared `infractl` script is not importable once installed.
[tool.setuptools.packages.find]
include = ["app*", "cli*"]
namespaces = true

[tool.setuptools.package-data]
"app.web" = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is fine in tests
