# Golden eval set — 46 cases with known-correct function selections
# (37 answerable, 9 where refusing is the only correct outcome).
#
# What this measures: whether the SELECTOR picks the right registry function(s)
# for a question. It does not measure whether production is healthy, and it does
# not need live infrastructure — selection is a pure function of the question and
# the tool specs the user's grants expose.
#
# Case fields:
#   id                  stable identifier; referenced by baseline.json
#   question            what a user actually types
#   surfaces            grants the notional user holds (controls what is offered)
#   expected_functions  registry entries that SHOULD be selected. Order-insensitive.
#                       An EMPTY list means the correct behaviour is to select
#                       nothing and say so.
#   expected_params     (optional) params that must be present and correct — this
#                       is how cloud-disambiguation is scored
#   expected_substrings (optional) substrings the synthesized answer must contain
#   must_refuse         (optional) true when "I can't answer that" is the ONLY
#                       correct outcome
#   tags                free-form, for slicing the scorecard
#
# Adding a case is cheap and is the right response to any production surprise.
# Removing one requires a reason — a deleted case is a regression you stopped
# being able to see.

