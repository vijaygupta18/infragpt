  # --- API error triage: the chain (added 2026-08-19) -----------------------
  #
  # These score the SELECTOR's first move. The full chain is multi-round and the
  # later steps depend on ids that only exist at runtime, so what is asserted
  # here is that the right door is opened — starting this class of question
  # anywhere other than the ranked error rates wastes the round that matters.
  - id: triage_which_apis_erroring
    question: Which APIs are throwing errors right now?
    surfaces: [metrics]
    expected_functions: [api_error_rates]
    tags: [triage, metrics, errors]
    note: >-
      The entry point for the whole chain. Answering from a per-service function
      requires already knowing which service, which is the thing being asked.

  - id: triage_which_errors_for_service
    question: What errors is the rider-app service throwing?
    surfaces: [metrics]
    expected_functions: [api_error_codes]
    tags: [triage, metrics, errors]
    note: >-
      "What errors" is the response-code breakdown: 502 and 500 send you to
      completely different places, so this must precede any log reading.

